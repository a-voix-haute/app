name: Publication

# Sur une poussée de tag « v… », compile en Release, signe avec le certificat
# Developer ID, fait notariser par Apple, agrafe le ticket, fabrique le disque
# d'installation et publie la release.
#
# Trois secrets sont nécessaires (voir Documentation/publication.md) :
#
#   CERTIFICAT_P12_BASE64      certificat Developer ID exporté, encodé en base64
#   CERTIFICAT_MOT_DE_PASSE    mot de passe de ce fichier .p12
#   NOTARISATION_MOT_DE_PASSE  mot de passe d'application Apple

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier, par exemple v1.1.0"
        required: true

env:
  EQUIPE_APPLE: 5D6QHL72QC
  IDENTIFIANT_APPLE: iachi.dimitri@gmail.com

jobs:
  publier:
    name: Compiler, notariser et publier
    runs-on: macos-26
    permissions:
      contents: write

    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v5


      - name: Installer le gem xcodeproj
        run: gem install xcodeproj --no-document

      # Le certificat est importé dans un trousseau temporaire, propre à cette
      # exécution : il disparaît avec la machine virtuelle.
      - name: Importer le certificat de signature
        env:
          CERTIFICAT_P12_BASE64: ${{ secrets.CERTIFICAT_P12_BASE64 }}
          CERTIFICAT_MOT_DE_PASSE: ${{ secrets.CERTIFICAT_MOT_DE_PASSE }}
        run: |
          TROUSSEAU="$RUNNER_TEMP/signature.keychain-db"
          MOT_DE_PASSE_TROUSSEAU="$(uuidgen)"
          CERTIFICAT="$RUNNER_TEMP/certificat.p12"

          echo -n "$CERTIFICAT_P12_BASE64" | base64 --decode > "$CERTIFICAT"

          security create-keychain -p "$MOT_DE_PASSE_TROUSSEAU" "$TROUSSEAU"
          security set-keychain-settings -lut 21600 "$TROUSSEAU"
          security unlock-keychain -p "$MOT_DE_PASSE_TROUSSEAU" "$TROUSSEAU"

          security import "$CERTIFICAT" \
            -k "$TROUSSEAU" \
            -P "$CERTIFICAT_MOT_DE_PASSE" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          # Sans cette autorisation, codesign demanderait une confirmation
          # interactive, impossible sur un runner.
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$MOT_DE_PASSE_TROUSSEAU" \
            "$TROUSSEAU" >/dev/null

          security list-keychain -d user -s "$TROUSSEAU" login.keychain-db

          EMPREINTE="$(security find-identity -v -p codesigning "$TROUSSEAU" \
            | grep 'Developer ID Application' \
            | head -1 \
            | awk '{print $2}')"

          if [ -z "$EMPREINTE" ]; then
            echo "::error::Aucun certificat Developer ID trouvé dans le trousseau importé."
            exit 1
          fi

          echo "EMPREINTE_SIGNATURE=$EMPREINTE" >> "$GITHUB_ENV"
          echo "Certificat importé : $EMPREINTE"

      - name: Enregistrer les identifiants de notarisation
        env:
          NOTARISATION_MOT_DE_PASSE: ${{ secrets.NOTARISATION_MOT_DE_PASSE }}
        run: |
          xcrun notarytool store-credentials "avoixhaute" \
            --apple-id "$IDENTIFIANT_APPLE" \
            --team-id "$EQUIPE_APPLE" \
            --password "$NOTARISATION_MOT_DE_PASSE"

      - name: Générer le projet
        run: ruby Scripts/generer_projet.rb
        env:
          LECTEUR_IDENTITE: ${{ env.EMPREINTE_SIGNATURE }}
          LECTEUR_EQUIPE: ''

      - name: Lancer les tests
        run: |
          xcodebuild -project AVoixHaute.xcodeproj \
            -scheme AVoixHauteTests \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Compiler avec la signature de distribution
        run: |
          xcodebuild -project AVoixHaute.xcodeproj \
            -scheme AVoixHaute \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="$EMPREINTE_SIGNATURE" \
            DEVELOPMENT_TEAM="$EQUIPE_APPLE" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_ENTITLEMENTS="Ressources/AVoixHaute.entitlements" \
            ENABLE_HARDENED_RUNTIME=YES \
            OTHER_CODE_SIGN_FLAGS="--timestamp --options=runtime" \
            build

      # Xcode ajoute get-task-allow d'office, y compris en Release : Apple
      # rejette toute soumission qui le déclare.
      - name: Resigner sans le droit de débogage
        run: |
          APP="build/Build/Products/Release/AVoixHaute.app"
          for CIBLE in "$APP/Contents/Resources/lire" "$APP"; do
            codesign --force \
              --sign "$EMPREINTE_SIGNATURE" \
              --entitlements "Ressources/AVoixHaute.entitlements" \
              --options runtime \
              --timestamp \
              "$CIBLE"
          done
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Faire notariser l'application
        run: |
          APP="build/Build/Products/Release/AVoixHaute.app"
          mkdir -p build/distribution
          ditto -c -k --keepParent "$APP" build/distribution/AVoixHaute.zip

          xcrun notarytool submit build/distribution/AVoixHaute.zip \
            --keychain-profile "avoixhaute" \
            --wait \
            --timeout 30m

          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"

      - name: Fabriquer le disque d'installation
        run: |
          APP="build/Build/Products/Release/AVoixHaute.app"
          MONTAGE="$(mktemp -d)"

          cp -R "$APP" "$MONTAGE/À Voix Haute.app"
          ln -s /Applications "$MONTAGE/Applications"

          hdiutil create \
            -volname "À Voix Haute" \
            -srcfolder "$MONTAGE" \
            -ov -format UDZO \
            "build/distribution/AVoixHaute.dmg"

          rm -rf "$MONTAGE"

          codesign --sign "$EMPREINTE_SIGNATURE" --timestamp \
            "build/distribution/AVoixHaute.dmg"

      - name: Faire notariser le disque
        run: |
          xcrun notarytool submit build/distribution/AVoixHaute.dmg \
            --keychain-profile "avoixhaute" \
            --wait \
            --timeout 30m

          xcrun stapler staple build/distribution/AVoixHaute.dmg
          spctl -a -vvv -t open --context context:primary-signature \
            build/distribution/AVoixHaute.dmg

      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"

          gh release create "$VERSION" \
            "build/distribution/AVoixHaute.dmg#À Voix Haute $VERSION (macOS)" \
            --title "À Voix Haute ${VERSION#v}" \
            --generate-notes \
            || gh release upload "$VERSION" \
                 "build/distribution/AVoixHaute.dmg#À Voix Haute $VERSION (macOS)" \
                 --clobber

      - name: Nettoyer le trousseau
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signature.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/certificat.p12"
